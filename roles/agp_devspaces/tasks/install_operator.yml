---
- name: Role agp_devspaces | Task install_operator | Check that operator name has been provided
  ansible.builtin.assert:
    that:
      - install_operator_name | default("") | length > 0
    fail_msg: install_operator_name must be set.

- name: "Role agp_devspaces | Task install_operator | Check that starting CSV also has autoapprove set to false {{ install_operator_name }}"  # yamllint disable-line rule:line-length
  when: install_operator_starting_csv | default("") | length > 0
  ansible.builtin.assert:
    that:
      - not (install_operator_automatic_install_plan_approval | default(true) | bool)
    fail_msg: Install plan automatic approval must be set to false when using a starting CSV.

- name: "Role agp_devspaces | Task install_operator | Set up for Namespace other than 'openshift-operators' {{ install_operator_name }}"
  when: install_operator_namespace is not match("openshift-operators")
  block:
    - name: "Ensure Namespace exists {{ install_operator_name }}"
      kubernetes.core.k8s:
        state: present
        api_version: v1
        kind: Namespace
        name: "{{ install_operator_namespace }}"

    - name: "Role agp_devspaces | Task install_operator | Ensure OperatorGroup exists {{ install_operator_name }}"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'operatorgroup.yaml.j2') | from_yaml }}"

- name: "Role agp_devspaces | Task install_operator | Create CatalogSource for use with catalog snapshot {{ install_operator_name }}"
  when: install_operator_catalogsource_setup | bool
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'catalogsource.yaml.j2') | from_yaml }}"

- name: "Role agp_devspaces | Task install_operator | Set subscription channel to provided channel {{ install_operator_name }}"
  when: install_operator_channel | default("") | length > 0
  ansible.builtin.set_fact:
    __install_operator_channel: "{{ install_operator_channel }}"

- name: "Role agp_devspaces | Task install_operator | Determine channel for the operator if no channel specified {{ install_operator_name }}"
  when: install_operator_channel | default("") | length == 0
  block:
    - name: Role agp_devspaces | Task install_operator | Get cluster version
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: r_cluster_version

    - name: "Role agp_devspaces | Task install_operator | Get PackageManifest for the operator {{ install_operator_name }}"
      kubernetes.core.k8s_info:
        api_version: packages.operators.coreos.com/v1
        kind: PackageManifest
        name: "{{ install_operator_packagemanifest_name }}"
        namespace: "{{ install_operator_catalogsource_namespace }}"
      register: r_packagemanifest

    # Set channel to the one matching the deployed cluster version.
    # If no matching channel available set to defaultChannel from the package manifest.
    - name: "Role agp_devspaces | Task install_operator | Set operator channel {{ install_operator_name }}"
      ansible.builtin.set_fact:
        __install_operator_channel: "{{ t_channel | regex_replace(' ') }}"
      vars:
        t_cluster_version: >-
          {{ r_cluster_version.resources[0].spec.channel | regex_replace('.*-(\d+\.\d+)', '\1') }}
        t_version_match_query: "[?name=='{{ t_cluster_version }}']|[0].name"
        t_version_match_channel: >-
          {{ r_packagemanifest.resources[0].status.channels | json_query(t_version_match_query) }}
        t_channel: >-
          {{ t_version_match_channel | default(r_packagemanifest.resources[0].status.defaultChannel, true) }}

- name: "Role agp_devspaces | Task install_operator | Print operator channel to be installed {{ install_operator_name }}"
  ansible.builtin.debug:
    msg: "Operator channel to be installed: {{ __install_operator_channel }}"

- name: "Role agp_devspaces | Task install_operator | Create operator subscription {{ install_operator_name }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'subscription.yaml.j2') | from_yaml }}"

- name: "Role agp_devspaces | Task install_operator | Wait until InstallPlan is created {{ install_operator_name }}"  # yamllint disable-line rule:line-length
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    namespace: "{{ install_operator_namespace }}"
  register: r_install_plans
  vars:
    __install_operator_install_plan_query: >-  # yamllint disable-line rule:line-length
      [?contains(spec.clusterServiceVersionNames[] | join(',', @),
      '{{ install_operator_csv_nameprefix }}') && status.phase ]
  retries: 100
  delay: 10
  until:
    - r_install_plans.resources | default([]) | length > 0
    - r_install_plans.resources | to_json | from_json | json_query(__install_operator_install_plan_query) | length > 0  # yamllint disable-line rule:line-length

- name: "Role agp_devspaces | Task install_operator | Set InstallPlan name {{ install_operator_name }}"  # yamllint disable-line rule:line-length
  ansible.builtin.set_fact:
    install_operator_install_plan_name: "{{ r_install_plans.resources | to_json | from_json | json_query(__install_operator_install_plan_search) }}"  # yamllint disable-line rule:line-length
  vars:
    __install_operator_install_plan_search: >-
      [?contains(spec.clusterServiceVersionNames[] | join(',', @), '{{ install_operator_csv_nameprefix }}')].metadata.name|[0]

- name: "Role agp_devspaces | Task install_operator | Print InstallPlan {{ install_operator_name }}"
  ansible.builtin.debug:
    msg: "InstallPlan: {{ install_operator_install_plan_name }}"

- name: "Role agp_devspaces | Task install_operator | Get InstallPlan {{ install_operator_name }}"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ install_operator_install_plan_name }}"
    namespace: "{{ install_operator_namespace }}"
  register: r_install_plan

- name: "Role agp_devspaces | Task install_operator | Approve InstallPlan if necessary {{ install_operator_name }}"  # yamllint disable-line rule:line-length
  when: r_install_plan.resources[0].status.phase is match("RequiresApproval")
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ install_operator_install_plan_name }}"
    namespace: "{{ install_operator_namespace }}"
    state: patched
    definition:
      spec:
        approved: true

- name: "Role agp_devspaces | Task install_operator | Get Installed CSV {{ install_operator_name }}"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ install_operator_name }}"
    namespace: "{{ install_operator_namespace }}"
  register: r_subscription
  retries: 30
  delay: 5
  until:
    - r_subscription.resources[0].status.currentCSV is defined
    - r_subscription.resources[0].status.currentCSV | length > 0

- name: Role agp_devspaces | Task install_operator | Debug subscription
  ansible.builtin.debug:
    var: r_subscription

- name: Role agp_devspaces | Task install_operator | Wait for CSV
  block:

    - name: "Wait until CSV is installed {{ install_operator_name }} "
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ r_subscription.resources[0].status.currentCSV }}"
        namespace: "{{ install_operator_namespace }}"
      register: r_csv
      retries: 60
      delay: 45
      until:
        - r_csv.resources | default([]) | length > 0
        - r_csv.resources[0].status.phase is defined
        - r_csv.resources[0].status.phase | length > 0
        - r_csv.resources[0].status.phase == "Succeeded"
      ignore_errors: "{{ install_operator_install_csv_ignore_error }}"
